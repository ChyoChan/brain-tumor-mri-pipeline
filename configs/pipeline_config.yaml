# ============================================================
# Pipeline Configuration
# ============================================================

seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  segmentation_model_dir: "models/segmentation"
  classification_model_dir: "models/classification"
  vlm_model_dir: "models/vlm"
  output_dir: "outputs"

dataset:
  kaggle_dataset: "sartajbhuvaji/brain-tumor-classification-mri"
  classes: ["glioma", "meningioma", "pituitary", "notumor"]
  num_classes: 4
  split_ratios: [0.8, 0.1, 0.1]   # train / val / test

segmentation:
  model: "UNet"
  in_channels: 1
  out_channels: 1
  base_filters: 64
  img_size: 256
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.00001
  epochs: 100
  patience: 15
  target_dice: 0.88
  target_hausdorff: 5.0
  save_path: "models/segmentation/best_unet.pth"

classification:
  backbone: "resnet50"
  pretrained: true
  input_size: 224
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 50
  patience: 10           # early-stopping patience
  num_workers: 4
  augmentation:
    rotation_degrees: 15
    horizontal_flip: true
    vertical_flip: false
    brightness: 0.2
    contrast: 0.2
  grid_search:
    learning_rates: [0.001, 0.0005, 0.0001, 0.00005]
    batch_sizes: [16, 32, 64]

explainability:
  gradcam_target_layer: "layer4"
  vlm_model: "google/medgemma-1.5-4b-it"
  report_max_tokens: 256
  report_temperature: 0.7
